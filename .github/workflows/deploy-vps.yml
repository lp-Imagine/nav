name: Deploy VPS

# push main 后 SSH 到轻量云：git pull + docker compose 重建
# 需在仓库 Settings → Secrets 配置 VPS_*（见 deploy/DEPLOY-DRAFTLY.md）

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'server/**'
      - 'data/**'
      - 'deploy/**'
      - '.github/workflows/deploy-vps.yml'
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Lighthouse
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ secrets.VPS_DEPLOY_PATH }}"
            if [ -z "$DEPLOY_PATH" ]; then
              DEPLOY_PATH="/www/wwwroot/nav"
            fi
            cd "$DEPLOY_PATH"
            git fetch origin main
            git reset --hard origin/main
            docker compose -f deploy/docker-compose.yml up -d --build
            curl -fsS "http://127.0.0.1:8080/api/health" || true
